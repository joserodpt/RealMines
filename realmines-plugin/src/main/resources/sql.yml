#
# Database settings for player stats and achievements.
#
# Changes to this file only take effect after a server restart - a plugin reload will NOT reconnect.
#
# Supported drivers: SQLITE, MYSQL, MARIADB, POSTGRESQL, SQLSERVER
# With SQLITE (the default) only "database" is used, as the name of the .db file created
# inside the RealMines plugin folder. Everything else is ignored.

driver: "SQLITE"
host: "localhost"
port: 3306
database: "RealMines"
username: ""
password: ""

Version: 1
