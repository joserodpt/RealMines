RealMines:
  Prefix: "&fReal&9Mines &7> "
  teleportPlayers: true
  teleportMessage: true
  actionbarMessages: true
  sendMinedItemsToInventory: false
  placeFarmLandBelowCrop: true
  resetMinesWhenNoPlayers: false
  broadcastResetMessageOnlyInWorld: false
  useButtonGUIForPercentages: true
  useWorldEditForBlockPlacement: true
  ignoreAirBlocksSchematicPasting: true
  disableMineResetOnServerStart: false
  disableMineClearingWhenDeleting: false
  announceTimes:
    - 30
    - 20
    - 10
    - 5
    - 4
    - 3
    - 2
    - 1
  Stats:
    # Track how many blocks each player mines, powering the achievement board and the leaderboards.
    # Turning this off stops all tracking, but keeps whatever is already saved in the database.
    Enabled: true
    # How often, in seconds, changed player stats are written to the database.
    # Counting happens in memory, so this only controls how much progress a server crash could lose.
    # Stats are also flushed when a player quits and when the server shuts down.
    Flush-Interval-Seconds: 60
    # How many entries the leaderboard GUI shows.
    Leaderboard-Size: 28
Version: 12